<style>
:root{--ink:#13213c;--blue:#155eef;--sky:#eaf2ff;--mint:#dff8ee;--paper:#fff;--muted:#64748b;--line:#dbe3ef;--shadow:0 16px 45px rgba(32,63,110,.11)}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font:16px/1.55 Arial,sans-serif}.topbar{height:68px;padding:0 max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topbar nav{display:flex;align-items:center;gap:2px}.topbar button{border:0;background:none;color:var(--ink);padding:9px}.role-indicator{display:inline-flex;align-items:center;border-radius:999px;background:#eaf2ff;color:#155eef;padding:5px 9px;font-size:.7rem;font-weight:800;white-space:nowrap}.role-indicator[hidden]{display:none}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--blue)}main{max-width:1120px;margin:auto;padding:38px 20px 80px}.view{display:none}.view.active{display:block}.hero{padding-top:70px}.eyebrow,.pill,.cycle article>span{font-size:.75rem;font-weight:800;letter-spacing:.12em;color:var(--blue)}h1{font-size:clamp(3rem,8vw,6.7rem);line-height:.93;letter-spacing:-.06em;margin:.25em 0}h1 em{color:var(--blue);font-style:normal}h2{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.25em 0 .4em;letter-spacing:-.045em}h3{margin:.35em 0}.hero>p{max-width:650px;color:var(--muted);font-size:1.15rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer}.primary,.secondary,.cycle button,.mission-card button,#view-teacher>button{border:0;border-radius:999px;padding:12px 19px;font-weight:700}.primary,.cycle button,.mission-card button,#view-teacher>button{background:var(--blue);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.path-grid,.cycle,.student-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:55px}.path-grid article,.cycle article,.student-grid article,.case{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.path-grid b{font-size:2rem;color:#bed0ef}.path-grid p,.cycle p{color:var(--muted)}.chapter-head,.dashboard-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}.chapter-number{font-size:7rem;font-weight:900;color:#dbe8ff;line-height:.8}.cycle{grid-template-columns:repeat(3,1fr);margin-top:20px}.case{margin-top:18px}.hidden{display:none!important}.narrow{max-width:520px;margin:auto;background:white;border-radius:24px;padding:28px;box-shadow:var(--shadow)}form{display:grid;gap:14px;margin:24px 0}label{display:grid;gap:5px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit}.text-button{border:0;background:none;color:var(--blue)}.student-grid{grid-template-columns:1.2fr 1fr 1fr;margin-top:22px}.passport{padding-left:20px}.passport li{margin:8px 0}.passport li:before{content:'□ ';color:var(--blue)}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);padding:18px;border-radius:18px}.stat strong{display:block;font-size:2rem}.student-table{width:100%;border-collapse:collapse;margin:20px 0;background:white}.student-table th,.student-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.team{padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px}.team ul{padding-left:18px}.diagnostic-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.worksheet{max-width:850px;margin:auto}.sheet{background:#fff;padding:17mm;box-shadow:var(--shadow);color:#111}.sheet header{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:8px}.sheet header small{display:block}.identity{border:1px solid #555;padding:8px;margin:14px 0}.sheet h3{font-size:.85rem;letter-spacing:.12em;border-bottom:1px solid #333;margin-top:18px}.lines{height:62px;background:repeating-linear-gradient(transparent,transparent 27px,#aaa 28px)}.lines.short{height:34px}.sheet table{width:100%;border-collapse:collapse}.sheet th,.sheet td{border:1px solid #333;padding:6px;text-align:left}.drawing{height:100px}#toast{position:fixed;right:18px;bottom:18px;background:#17213a;color:white;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;max-width:360px}#toast.show{opacity:1;transform:none}

.passport{padding-left:0;list-style:none}
@media print{#view-worksheet{display:none!important}#view-worksheet.active,#view-practice-sheet.active,#view-semester-card.active,#view-material-summary.active{display:block!important}.sheet section,.practice-field,.material-summary-sheet h3,.material-summary-sheet ul{break-inside:avoid}.practice-report-form{display:block}.practice-field{display:block;margin:0 0 5mm;border:1px solid #777}.practice-field textarea{display:block;width:100%;border:0;overflow:visible;resize:none;color:#000;background:#fff}.practice-editor-note,.practice-save-actions{display:none!important}.practice-brief,.team-roster{font-size:9.5pt}.practice-title-row h2{font-size:20pt;margin:3mm 0}.material-summary-sheet{font-size:10.5pt}.material-summary-sheet h2{font-size:22pt}.projection-exit{display:none!important}}
